<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Machine Swift 企业级智能管理平台，基于 Spring Boot + Vue 3 的微服务/单体双架构解决方案" />
  <meta name="keywords" content="Machine,企业管理,权限管理,CRM,SCM,AI,流程引擎" />
  <meta property="og:title" content="Machine Swift" />
  <meta property="og:description" content="企业级智能管理平台" />
  <meta property="og:type" content="website" />
  <link rel="dns-prefetch" href="http://api.machinerust.cn" />
  <link rel="preconnect" href="http://api.machinerust.cn" />
  <title>Machine Swift</title>
</head>

<body>
  <div id="app"></div>
  <div id="app-boot">
    <div class="app-boot__spinner"></div>
    <p class="app-boot__text">正在加载…</p>
  </div>
  <style>
    #app-boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f5f7fa; }
    .app-boot__spinner { width: 36px; height: 36px; border: 3px solid #dcdfe6; border-top-color: #409eff; border-radius: 50%; animation: app-boot-spin .8s linear infinite; }
    .app-boot__text { margin: 0; color: #606266; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @keyframes app-boot-spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
